name: Build Imperial Troopers

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Python for animation retargeting
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate skeletal animation clips
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = "ImperialTrooper_SourceBundle_0.3.4/ImperialTrooper_SourceProject"
          $archive = Join-Path $env:RUNNER_TEMP "UAL1_Standard.zip"
          $assetDirectory = Join-Path $env:RUNNER_TEMP "UAL1_Standard"
          $metadata = Invoke-RestMethod -Method Post -Uri "https://quaternius.itch.io/universal-animation-library/file/17958403?source=game_download&as_props=1" -Headers @{ "User-Agent" = "Mozilla/5.0" }
          if (!$metadata.url) { throw "Quaternius did not return a download URL for its Standard animation pack" }
          Invoke-WebRequest -Uri $metadata.url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $assetDirectory -Force
          $animationFiles = @(Get-ChildItem -Path $assetDirectory -Recurse -File | Where-Object { $_.Extension -in @(".glb", ".fbx") })
          if ($animationFiles.Count -eq 0) {
            Get-ChildItem -Path $assetDirectory -Recurse -File | Select-Object -ExpandProperty FullName
            throw "The official Quaternius Standard archive contained no GLB or FBX animation files"
          }
          Write-Host "Animation model files supplied in official Quaternius Standard archive:"
          $animationFiles | ForEach-Object { Write-Host ("{0} ({1} bytes)" -f $_.FullName, $_.Length) }
          # The creator switched the Unreal export to GLB in 2026. Prefer GLB first because
          # Assimp currently sees no clips in the packaged Unity FBX variant on CI.
          $animationSourceFile = $animationFiles | Where-Object { $_.Name -eq "UAL1_Standard.glb" } | Select-Object -First 1
          if (!$animationSourceFile) { $animationSourceFile = $animationFiles | Where-Object { $_.Name -eq "UAL1_Standard.fbx" } | Select-Object -First 1 }
          if (!$animationSourceFile) { $animationSourceFile = $animationFiles | Where-Object { $_.Name -match "Standard.*\.(glb|fbx)$" } | Select-Object -First 1 }
          if (!$animationSourceFile) { $animationSourceFile = $animationFiles | Sort-Object Length -Descending | Select-Object -First 1 }
          python -m pip install --disable-pip-version-check assimp_py
          if ($LASTEXITCODE -ne 0) { throw "Could not install assimp_py for animation conversion" }
          python "ImperialTrooper_SourceBundle_0.3.4/tools/retarget_ual_animations.py" "$project/Assets/Stormtrooper.fbx" "$($animationSourceFile.FullName)" "$project/Assets/Stormtrooper.ianim"
          if ($LASTEXITCODE -ne 0) { throw "Animation retargeting failed; inspect clip and bone mapping output above" }

      - name: Restore
        working-directory: ImperialTrooper_SourceBundle_0.3.4/ImperialTrooper_SourceProject
        run: dotnet restore ImperialTrooperMod.csproj --configfile nuget.config

      - name: Build Release
        working-directory: ImperialTrooper_SourceBundle_0.3.4/ImperialTrooper_SourceProject
        run: dotnet build ImperialTrooperMod.csproj --configuration Release --no-restore

      - name: Verify packaged files
        shell: pwsh
        run: |
          $dir = "ImperialTrooper_SourceBundle_0.3.4/ImperialTrooper_SourceProject/release/plugins/ImperialTrooper"
          if (!(Test-Path "$dir/ImperialTrooper.dll")) { throw "Build output DLL is missing" }
          if (!(Test-Path "$dir/Stormtrooper.imodel")) { throw "Stormtrooper.imodel is missing" }
          if (!(Test-Path "$dir/Stormtrooper.ianim")) { throw "Retargeted Stormtrooper.ianim is missing" }
          if ((Get-Item "$dir/Stormtrooper.ianim").Length -lt 10000) { throw "Retargeted Stormtrooper.ianim is unexpectedly small" }
          if (!(Test-Path "$dir/ANIMATION_LICENSE.txt")) { throw "Animation source license file is missing" }
          if (!(Test-Path "$dir/Audio")) { throw "Audio directory is missing" }
          $audio = Get-ChildItem "$dir/Audio" -Filter *.mp3
          if ($audio.Count -lt 1) { throw "No MP3 audio files were packaged" }

      - name: Create Thunderstore plugin ZIP
        shell: pwsh
        run: |
          $dir = "ImperialTrooper_SourceBundle_0.3.4/ImperialTrooper_SourceProject/release/plugins/ImperialTrooper"
          Compress-Archive -Path "$dir/*" -DestinationPath "ImperialTroopers_0.3.6_build.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImperialTroopers-0.3.6-build
          path: |
            ImperialTroopers_0.3.4_build.zip
            ImperialTrooper_SourceBundle_0.3.4/ImperialTrooper_SourceProject/release/plugins/ImperialTrooper/ImperialTrooper.dll
          if-no-files-found: error
          retention-days: 14
