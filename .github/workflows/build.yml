name: Build Imperial Troopers

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Python for animation retargeting
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate skeletal animation clips
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = "ImperialTrooper_SourceBundle_0.3.4/ImperialTrooper_SourceProject"
          $assetDirectory = Join-Path $env:RUNNER_TEMP "UAL1_Standard"
          New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null
          $animationSource = Join-Path $assetDirectory "UAL1_Standard.glb"
          $animationSourceUrl = "https://raw.githubusercontent.com/Barbatos6669/elderforge/bb2ce469f0ab2ccfc487faef55550ba07fae2483/assets/animations/universal_animation_library_1/UAL1_Standard.glb"
          Invoke-WebRequest -Uri $animationSourceUrl -OutFile $animationSource -Headers @{ "User-Agent" = "ImperialTroopers-Build/0.3.16" }
          if (!(Test-Path $animationSource) -or (Get-Item $animationSource).Length -lt 1000000) { throw "Pinned CC0 UAL1 Standard GLB download is missing or unexpectedly small" }
          Write-Host ("Using pinned CC0 Quaternius UAL1 source from " + $animationSourceUrl + " (" + (Get-Item $animationSource).Length + " bytes)")
          $animationSourceFile = Get-Item $animationSource
          python -m pip install --disable-pip-version-check assimp_py pillow imageio-ffmpeg
          if ($LASTEXITCODE -ne 0) { throw "Could not install assimp_py for animation conversion" }
          python "ImperialTrooper_SourceBundle_0.3.4/tools/convert_fbx_to_itmd.py" "$project/Assets/Stormtrooper.fbx" "$project/Assets/Stormtrooper.imodel"
          if ($LASTEXITCODE -ne 0) { throw "Rigged model conversion failed; inspect helper-bone collapse output above" }
          python "ImperialTrooper_SourceBundle_0.3.4/tools/retarget_ual_animations.py" "$project/Assets/Stormtrooper.fbx" "$($animationSourceFile.FullName)" "$project/Assets/Stormtrooper.ianim"
          if ($LASTEXITCODE -ne 0) { throw "Animation retargeting failed; inspect clip and bone mapping output above" }
          python "ImperialTrooper_SourceBundle_0.3.4/tools/convert_audio_to_wav.py" "$project/Audio"
          if ($LASTEXITCODE -ne 0) { throw "MP3 to WAV conversion failed; the game needs Unity-compatible PCM audio" }

      - name: Restore
        working-directory: ImperialTrooper_SourceBundle_0.3.4/ImperialTrooper_SourceProject
        run: dotnet restore ImperialTrooperMod.csproj --configfile nuget.config

      - name: Build Release
        working-directory: ImperialTrooper_SourceBundle_0.3.4/ImperialTrooper_SourceProject
        run: dotnet build ImperialTrooperMod.csproj --configuration Release --no-restore

      - name: Generate mod icon
        shell: pwsh
        run: |
          $dir = "ImperialTrooper_SourceBundle_0.3.4/ImperialTrooper_SourceProject/release/plugins/ImperialTrooper"
          python "ImperialTrooper_SourceBundle_0.3.4/tools/make_mod_icon.py" "$dir/icon.png"
          if ($LASTEXITCODE -ne 0) { throw "Could not create Thunderstore icon" }

      - name: Verify packaged files
        shell: pwsh
        run: |
          $dir = "ImperialTrooper_SourceBundle_0.3.4/ImperialTrooper_SourceProject/release/plugins/ImperialTrooper"
          if (!(Test-Path "$dir/ImperialTrooper.dll")) { throw "Build output DLL is missing" }
          if (!(Test-Path "$dir/Stormtrooper.imodel")) { throw "Stormtrooper.imodel is missing" }
          if (!(Test-Path "$dir/Stormtrooper.ianim")) { throw "Retargeted Stormtrooper.ianim is missing" }
          if ((Get-Item "$dir/Stormtrooper.ianim").Length -lt 10000) { throw "Retargeted Stormtrooper.ianim is unexpectedly small" }
          if (!(Test-Path "$dir/ANIMATION_LICENSE.txt")) { throw "Animation source license file is missing" }
          if (!(Test-Path "$dir/Audio")) { throw "Audio directory is missing" }
          if (!(Test-Path "$dir/icon.png")) { throw "Thunderstore mod icon is missing" }
          python -c "from PIL import Image; import sys; im=Image.open(sys.argv[1]); assert im.format == 'PNG' and im.size == (256,256), f'icon must be a 256x256 PNG, got {im.format} {im.size}'" "$dir/icon.png"
          if ($LASTEXITCODE -ne 0) { throw "Thunderstore mod icon failed validation" }
          $audio = Get-ChildItem "$dir/Audio" -Filter *.wav
          if ($audio.Count -lt 1) { throw "Fewer than eight PCM WAV audio files were packaged" }

      - name: Create Thunderstore package ZIP
        shell: pwsh
        run: |
          $dir = "ImperialTrooper_SourceBundle_0.3.4/ImperialTrooper_SourceProject/release/plugins/ImperialTrooper"
          $packageRoot = Join-Path $env:RUNNER_TEMP "ImperialTroopersPackage"
          if (Test-Path $packageRoot) { Remove-Item -Recurse -Force $packageRoot }
          New-Item -ItemType Directory -Path $packageRoot | Out-Null
          Copy-Item -Path "$dir/*" -Destination $packageRoot -Recurse -Force

          $manifest = @{
            name = "ImperialTroopers"
            version_number = "0.3.16"
            website_url = "https://github.com/aleksandrkudina-ui/Imperial-Troopers"
            description = "Risk of Rain 2 enemy mod adding Imperial troopers with blaster burst fire, tactical positioning, skeletal animations and radio chatter."
            dependencies = @(
              "RiskofThunder-RoR2BepInExPack-1.48.0",
              "RiskofThunder-R2API_Director-3.1.2",
              "RiskofThunder-R2API_Prefab-1.1.1",
              "RiskofThunder-R2API_ContentManagement-1.1.0"
            )
          } | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText((Join-Path $packageRoot "manifest.json"), $manifest + "`n", [System.Text.UTF8Encoding]::new($false))

          $readme = @'
          # Imperial Troopers

          Adds hostile Imperial stormtrooper enemies to Risk of Rain 2.

          ## Features
          - Custom rigged stormtrooper model and skeletal animation clips.
          - Slower red blaster bolts and controlled burst fire.
          - Positional infantry behavior that tries to maintain a firing range and only repositions briefly when its line of fire is blocked.
          - Blaster audio and radio chatter.

          ## Installation
          Import this ZIP through Thunderstore Mod Manager's **Settings → Profile → Import local mod**.

          ## Notes
          This is a development build. Verify enemy behavior and audio in-game after installing.
          '@
          [System.IO.File]::WriteAllText((Join-Path $packageRoot "README.md"), $readme + "`n", [System.Text.UTF8Encoding]::new($false))

          $zipPath = "PyramidHead-ImperialTroopers-0.3.16.zip"
          Compress-Archive -Path "$packageRoot/*" -DestinationPath $zipPath -Force
          if (!(Test-Path $zipPath)) { throw "Thunderstore package ZIP was not created" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $entryNames = @($zip.Entries | ForEach-Object { $_.FullName })
            $required = @("manifest.json", "README.md", "icon.png", "ImperialTrooper.dll", "Stormtrooper.imodel", "Stormtrooper.ianim", "ANIMATION_LICENSE.txt")
            foreach ($name in $required) {
              if ($entryNames -notcontains $name) { throw "Thunderstore ZIP is missing required entry: $name" }
            }
            if (!($entryNames | Where-Object { $_ -like "Audio/*.wav" })) { throw "Thunderstore ZIP contains no packaged PCM WAV audio files" }
            Write-Host ("Validated Thunderstore package entries: " + ($entryNames -join ", "))
          }
          finally { $zip.Dispose() }
          if ((Get-Item $zipPath).Length -lt 100000) { throw "Thunderstore package ZIP is unexpectedly small" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImperialTroopers-0.3.16-package
          path: |
            PyramidHead-ImperialTroopers-0.3.16.zip
            ImperialTrooper_SourceBundle_0.3.4/ImperialTrooper_SourceProject/release/plugins/ImperialTrooper/ImperialTrooper.dll
          if-no-files-found: error
          retention-days: 14
